<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>SecurityCam</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link id="manifest-placeholder" rel="manifest">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3682/3682323.png">

    <style>
        /* Base */
        body { background-color: #000; color: #fff; overflow: hidden; height: 100dvh; width: 100vw; font-family: system-ui, sans-serif; user-select: none; -webkit-touch-callout: none; }
        
        #video-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        
        video { 
            width: 100%; height: 100%; 
            object-fit: contain; 
            transform: translateZ(0);
        }
        video.filled { object-fit: cover; }
        video.offline { opacity: 0.5; filter: grayscale(100%); } 

        /* Botões */
        .float-btn {
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(16, 185, 129, 0.3);
            backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; color: #10b981; -webkit-tap-highlight-color: transparent;
        }
        .float-btn:active { background: rgba(16, 185, 129, 0.2); transform: scale(0.9); }

        .talk-btn {
            position: absolute; bottom: 40px; right: 30px; z-index: 60;
            width: 72px; height: 72px; font-size: 24px;
            background: rgba(6, 78, 59, 0.4); border: 2px solid rgba(16, 185, 129, 0.5);
            backdrop-filter: blur(5px); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); -webkit-tap-highlight-color: transparent; color: #10b981;
        }
        .talk-btn:active, .talk-btn.talking { 
            background: #10b981; border-color: #34d399; transform: scale(0.95); color: #000;
            box-shadow: 0 0 25px #10b981; 
        }

        /* Badges */
        .badge {
            position: absolute; z-index: 50;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(16, 185, 129, 0.2);
            font-size: 11px; font-weight: bold; color: #34d399; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
        }
        .top-left { top: 20px; left: 20px; }
        .top-right { top: 20px; right: 20px; }

        /* Stealth Layer */
        #stealth-layer {
            position: fixed; inset: 0; background-color: #000000; z-index: 9999;
            display: none; cursor: none;
        }
        
        /* Lista */
        .cam-item {
            background: linear-gradient(90deg, #18181b 0%, #09090b 100%);
            border: 1px solid #064e3b; border-radius: 10px; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
        }
        .cam-item:active { transform: scale(0.98); border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="antialiased">

    <div id="ui-setup" class="absolute inset-0 z-50 bg-[#000000] flex flex-col p-6 overflow-y-auto">
        <button onclick="ui.toggleCredits(true)" class="absolute top-6 right-6 w-9 h-9 rounded-full border border-emerald-900/50 text-emerald-600 hover:text-emerald-400 hover:border-emerald-500 flex items-center justify-center transition-all z-10" title="Créditos" aria-label="Abrir créditos">
            <i class="fa-solid fa-circle-info text-sm"></i>
        </button>
        <div class="w-full max-w-sm mx-auto mt-8">
            <div class="text-center mb-8">
                <i class="fa-solid fa-microchip text-4xl text-emerald-500 mb-2 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]"></i>
                <h1 class="text-3xl font-black text-white tracking-tight">SECURITY<span class="text-emerald-500">CAM</span></h1>
                <p class="text-[10px] text-emerald-500/50 uppercase tracking-widest mt-1 font-bold">Encrypted & Optimized</p>
            </div>

            <div class="bg-zinc-900/50 p-1.5 rounded-xl flex mb-6 border border-emerald-900/30">
                <button onclick="ui.setMode('camera')" id="tab-cam" class="flex-1 py-3 text-xs font-bold rounded-lg bg-emerald-600 text-black shadow-[0_0_15px_rgba(16,185,129,0.3)]">TRANSMITIR</button>
                <button onclick="ui.setMode('monitor')" id="tab-mon" class="flex-1 py-3 text-xs font-bold rounded-lg text-emerald-600 hover:text-emerald-400">ASSISTIR</button>
            </div>

            <form onsubmit="app.saveAndStart(event)" class="space-y-4">
                <input type="text" id="inp-name" class="w-full bg-zinc-900 border border-emerald-900/50 rounded-xl p-4 text-emerald-100 focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.2)] outline-none appearance-none transition-all hidden" placeholder="Apelido (ex: Base)" autocomplete="off">
                <div class="flex gap-3">
                    <input type="text" id="inp-id" class="w-full bg-zinc-900 border border-emerald-900/50 rounded-xl p-4 text-emerald-400 font-mono uppercase focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.2)] outline-none appearance-none transition-all" placeholder="ID" required autocomplete="off">
                    <input type="password" id="inp-pin" class="w-32 bg-zinc-900 border border-emerald-900/50 rounded-xl p-4 text-center text-emerald-400 font-mono focus:border-emerald-500 focus:shadow-[0_0_10px_rgba(16,185,129,0.2)] outline-none appearance-none transition-all" placeholder="PIN" required inputmode="numeric" pattern="[0-9]{6,}" minlength="6" title="Mínimo de 6 dígitos numéricos">
                </div>
                <button type="submit" id="btn-start" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.3)] mt-2 active:scale-95 transition-all"><i class="fa-solid fa-video mr-2"></i> INICIAR</button>
            </form>

            <div id="saved-list-container" class="mt-8 hidden">
                <h3 class="text-xs text-emerald-600 uppercase font-bold tracking-wider mb-2"><i class="fa-solid fa-network-wired mr-1"></i> Terminais Salvos</h3>
                <div id="saved-list" class="space-y-2"></div>
            </div>

            <div id="log" class="text-center text-xs text-red-500 mt-6 min-h-[20px] font-mono font-bold drop-shadow-[0_0_5px_rgba(239,68,68,0.5)]"></div>
        </div>
    </div>

    <div id="ui-app" class="absolute inset-0 z-40 bg-black hidden">
        <div id="video-wrapper">
            <video id="vid-main" autoplay playsinline webkit-playsinline muted></video>
            <audio id="audio-intercom" autoplay></audio>

            <div id="reconnect-overlay" class="absolute inset-0 bg-black/90 z-30 flex flex-col items-center justify-center backdrop-blur-sm hidden">
                <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl mb-4 animate-pulse drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]"></i>
                <span class="text-red-500 font-mono font-bold text-sm tracking-widest">SINAL PERDIDO</span>
                <button onclick="location.reload()" class="mt-6 px-6 py-2 bg-transparent border border-red-500 text-red-500 hover:bg-red-500/20 font-bold rounded-full text-xs transition-all" aria-label="Recarregar aplicativo">
                    REINICIAR CONEXÃO
                </button>
            </div>

            <div id="badge-viewers" class="badge top-right hidden">
                <i class="fa-solid fa-eye text-emerald-400"></i> <span id="viewer-count" class="text-white">0</span>
            </div>
            <div id="badge-status" class="badge top-left hidden">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_5px_#10b981]"></div> <span id="conn-status" class="text-emerald-100">SYS.ONLINE</span>
            </div>
            
            <button id="btn-stealth" onclick="ui.toggleStealth()" class="float-btn w-12 h-12 absolute top-20 right-5 z-50 hidden bg-black/80 border-zinc-800 text-zinc-500" aria-label="Ativar modo furtivo">
                <i class="fa-solid fa-user-ninja"></i>
            </button>

            <button id="btn-fit" onclick="ui.toggleFit()" class="float-btn w-10 h-10 absolute top-20 right-20 z-50 hidden" aria-label="Tela cheia">
                <i class="fa-solid fa-expand" id="icon-fit"></i>
            </button>

            <button id="btn-share" onclick="ui.toggleShare(true)" class="float-btn w-10 h-10 absolute top-36 right-5 z-50 hidden" aria-label="Compartilhar acesso à câmera">
                <i class="fa-solid fa-share-nodes"></i>
            </button>

            <button id="btn-record" onclick="app.toggleRecording()" class="float-btn w-10 h-10 absolute top-36 right-5 z-50 hidden" aria-label="Gravar localmente">
                <i class="fa-solid fa-circle-dot" id="icon-record"></i>
            </button>

            <button id="btn-talk" class="talk-btn hidden" onmousedown="app.startTalk()" onmouseup="app.stopTalk()" ontouchstart="app.startTalk()" ontouchend="app.stopTalk()" aria-label="Segurar para falar">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <button id="btn-sound" onclick="ui.unlockAudio()" class="absolute z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-emerald-600/80 border border-emerald-400 text-white px-8 py-4 rounded-full font-bold hidden shadow-[0_0_20px_rgba(16,185,129,0.4)] animate-pulse backdrop-blur-md" aria-label="Ativar som">
                <i class="fa-solid fa-volume-high mr-2"></i> DESBLOQUEAR ÁUDIO
            </button>

            <div class="absolute bottom-8 left-8 z-50">
                <button onclick="app.stop()" class="w-14 h-14 rounded-full bg-black/60 text-red-500 border border-red-500/50 flex items-center justify-center float-btn shadow-[0_0_10px_rgba(239,68,68,0.2)]" aria-label="Desligar">
                    <i class="fa-solid fa-power-off text-xl"></i>
                </button>
            </div>
            
            <div class="absolute bottom-8 left-24 z-50">
                 <button id="btn-swap" onclick="app.swapCam()" class="hidden w-14 h-14 rounded-full bg-black/60 text-emerald-400 border border-emerald-500/50 flex items-center justify-center float-btn" aria-label="Trocar câmera">
                    <i class="fa-solid fa-camera-rotate text-xl"></i>
                </button>
            </div>
        </div>

        <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#000] z-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500 mb-6 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]"></i>
            <span id="loader-txt" class="text-xs font-mono text-emerald-600 tracking-[0.2em] font-bold">ESTABELECENDO CONEXÃO...</span>
        </div>

        <div id="stealth-layer" ondblclick="ui.toggleStealth()"></div>

        <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[70] bg-zinc-950 border border-emerald-500/50 text-emerald-100 text-sm font-bold px-5 py-3 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] opacity-0 pointer-events-none transition-opacity duration-300 max-w-[85%] text-center"></div>
    </div>

    <div id="share-overlay" class="absolute inset-0 z-[60] bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-zinc-950 border border-emerald-900/50 rounded-2xl p-6 text-center shadow-[0_0_30px_rgba(16,185,129,0.15)]">
            <i class="fa-solid fa-qrcode text-3xl text-emerald-500 mb-3 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]"></i>
            <h2 class="text-sm font-bold text-white tracking-tight mb-3">Convidar espectador</h2>
            <div class="bg-white p-2 rounded-xl inline-block">
                <img id="share-qr" src="" alt="QR code de acesso" width="180" height="180">
            </div>
            <p class="text-[10px] text-emerald-600 mt-3 mb-1">Escanear abre o app já preenchido</p>
            <button onclick="ui.copyShareLink()" id="btn-copy-share" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl transition-all">
                <i class="fa-solid fa-copy mr-1"></i> COPIAR LINK
            </button>
            <button onclick="ui.toggleShare(false)" class="mt-2 w-full text-emerald-600 text-xs font-bold py-2">FECHAR</button>
        </div>
    </div>

    <div id="credits-overlay" class="absolute inset-0 z-[60] bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-zinc-950 border border-emerald-900/50 rounded-2xl p-6 text-center shadow-[0_0_30px_rgba(16,185,129,0.15)]">
            <i class="fa-solid fa-shield-halved text-3xl text-emerald-500 mb-3 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]"></i>
            <h2 class="text-lg font-black text-white tracking-tight mb-1">SECURITY<span class="text-emerald-500">CAM</span></h2>
            <p class="text-emerald-100 text-sm font-bold mt-4">Kauã Mazur dos Reis</p>
            <p class="text-emerald-600 text-xs mt-1">&copy; 2026. Todos os direitos reservados.</p>
            <div class="mt-5 pt-5 border-t border-emerald-900/30">
                <p class="text-[10px] text-emerald-600 uppercase tracking-wider font-bold mb-2">Dicas, sugestões ou bugs</p>
                <a href="mailto:kmzsuportt1@gmail.com" class="text-emerald-400 text-sm font-mono hover:text-emerald-300 transition-colors break-all">
                    <i class="fa-solid fa-envelope mr-1"></i> kmzsuportt1@gmail.com
                </a>
            </div>
            <button onclick="ui.toggleCredits(false)" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl transition-all">FECHAR</button>
        </div>
    </div>

    <audio id="keep-alive" loop style="display:none;">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjIwLjEwMAAAAAAAAAAAAAAA//oeAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMD//////////////////////////////////////////////////////////////////wAAAAA=" type="audio/mpeg">
    </audio>

    <script>
        // === CONFIG OTIMIZADA ===
        const ICE_SERVERS = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' },
                // TURN relay: essencial para conectar atrás de NAT simétrico/CGNAT
                // (4G, redes corporativas, ou cruzando países) onde STUN sozinho falha.
                // Servidor de demonstração público (openrelay) — para produção,
                // troque por um TURN próprio ou um serviço pago (Twilio, Metered, etc).
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
            ],
            sdpSemantics: 'unified-plan',
            iceCandidatePoolSize: 10
        };
        const PREFIX = "sc30-opt-";

        // Sufixo aleatório persistente por nome de câmera: torna o ID final menos
        // previsível/enumerável, mas mantém o mesmo ID entre reinícios da mesma câmera.
        const getOrCreateSalt = (baseId) => {
            const key = 'sc_salt_' + baseId;
            let salt = localStorage.getItem(key);
            if (!salt) {
                salt = Math.random().toString(36).slice(2, 7);
                localStorage.setItem(key, salt);
            }
            return salt;
        };

        const m = { "name": "SecurityCam", "display": "standalone", "background_color": "#000000", "theme_color": "#000000", "icons": [{ "src": "https://cdn-icons-png.flaticon.com/512/3682/3682323.png", "sizes": "512x512", "type": "image/png" }] };
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(new Blob([JSON.stringify(m)], {type: 'application/json'})));

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // === WAKE LOCK RESILIENTE ===
        let wakeLock = null;
        const requestWakeLock = async () => {
            try { 
                wakeLock = await navigator.wakeLock.request('screen'); 
            } catch (err) { console.warn("WakeLock falhou:", err); }
        };
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
            if (document.visibilityState === 'visible' && typeof app !== 'undefined' && app.lastCreds) {
                // Timers normais (setTimeout) podem ficar suspensos por minutos em segundo
                // plano no navegador mobile. Ao voltar pro app, força uma checagem imediata
                // em vez de esperar o retry (que pode nunca ter disparado).
                if (app.role === 'camera') {
                    if (!app.peer || app.peer.destroyed) {
                        app.startCamera(app.lastCreds.myId, app.lastCreds.pin);
                    } else if (app.peer.disconnected) {
                        try { app.peer.reconnect(); } catch(e) {}
                    }
                } else if (app.role === 'monitor') {
                    if (!app.peer || app.peer.destroyed) {
                        app.startMonitor(app.lastCreds.targetId, app.lastCreds.pin);
                    } else if (app.peer.disconnected) {
                        try { app.peer.reconnect(); } catch(e) {}
                    }
                }
            }
        });

        const syncFitIcon = () => {
            const i = document.getElementById('icon-fit'), v = document.getElementById('vid-main');
            if (!i || !v) return;
            if (document.fullscreenElement) { i.classList.replace('fa-expand','fa-compress'); v.classList.add('filled'); }
            else { i.classList.replace('fa-compress','fa-expand'); v.classList.remove('filled'); }
        };
        document.addEventListener('fullscreenchange', syncFitIcon);
        document.addEventListener('webkitfullscreenchange', syncFitIcon);

        // Kick periódico: se o navegador pausar a mídia sozinho (economia de energia,
        // política de autoplay) enquanto deveria estar tocando, tenta retomar sem
        // precisar de nenhuma ação do usuário.
        setInterval(() => {
            if (typeof app === 'undefined' || !app.role) return;
            if (app.role === 'monitor') {
                const v = document.getElementById('vid-main');
                const reconnecting = !document.getElementById('reconnect-overlay').classList.contains('hidden');
                if (v && v.srcObject && v.paused && !reconnecting) {
                    v.play().catch(() => {});
                }
            } else if (app.role === 'camera') {
                const a = document.getElementById('audio-intercom');
                if (a && a.srcObject && a.paused) a.play().catch(() => {});
            }
        }, 10000);

        // === UI MODULE ===
        const ui = {
            mode: 'camera',
            setMode: (m) => {
                ui.mode = m;
                const bC=document.getElementById('tab-cam'), bM=document.getElementById('tab-mon'), bS=document.getElementById('btn-start');
                const list=document.getElementById('saved-list-container'), inp=document.getElementById('inp-name');
                if (m === 'camera') {
                    bC.className="flex-1 py-3 text-xs font-bold rounded-lg bg-emerald-600 text-black shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all";
                    bM.className="flex-1 py-3 text-xs font-bold rounded-lg text-emerald-600 hover:text-emerald-400 transition-all bg-transparent shadow-none";
                    bS.innerHTML=`<i class="fa-solid fa-video mr-2"></i> TRANSMITIR`;
                    list.classList.add('hidden'); inp.classList.add('hidden');
                } else {
                    bM.className="flex-1 py-3 text-xs font-bold rounded-lg bg-emerald-600 text-black shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all";
                    bC.className="flex-1 py-3 text-xs font-bold rounded-lg text-emerald-600 hover:text-emerald-400 transition-all bg-transparent shadow-none";
                    bS.innerHTML=`<i class="fa-solid fa-eye mr-2"></i> ASSISTIR`;
                    list.classList.remove('hidden'); inp.classList.remove('hidden');
                    storage.renderList();
                }
            },
            log: (msg) => { const e=document.getElementById('log'); e.innerText=msg; if(msg) setTimeout(()=>e.innerText="", 4000); },
            toggleFit: async () => {
                const v = document.getElementById('vid-main'), i = document.getElementById('icon-fit');
                const stage = document.getElementById('ui-app');
                try {
                    if (!document.fullscreenElement) {
                        if (stage.requestFullscreen) await stage.requestFullscreen();
                        else if (stage.webkitRequestFullscreen) await stage.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) await document.exitFullscreen();
                        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
                    }
                } catch(e) { /* alguns navegadores exigem gesto direto do usuário; ignora se falhar */ }
                if(v.classList.contains('filled')) { v.classList.remove('filled'); i.classList.replace('fa-compress','fa-expand'); }
                else { v.classList.add('filled'); i.classList.replace('fa-expand','fa-compress'); }
            },
            toggleStealth: () => {
                const el = document.getElementById('stealth-layer');
                if(el.style.display === 'none') { el.style.display = 'block'; if(!sessionStorage.getItem('h30')) {ui.toast("Modo furtivo ativo — duplo clique na tela preta pra sair"); sessionStorage.setItem('h30','1');}}
                else { el.style.display = 'none'; }
            },
            unlockAudio: () => {
                const v = document.getElementById('vid-main');
                v.muted = false; v.play();
                document.getElementById('btn-sound').classList.add('hidden');
            },
            showReconnect: (show) => {
                const el = document.getElementById('reconnect-overlay');
                if(show) { el.classList.remove('hidden'); document.getElementById('vid-main').classList.add('offline'); }
                else { el.classList.add('hidden'); document.getElementById('vid-main').classList.remove('offline'); }
            },
            toggleCredits: (show) => {
                document.getElementById('credits-overlay').classList.toggle('hidden', !show);
            },
            toggleShare: (show) => {
                if (show && app.myFullId) {
                    const link = `${location.origin}${location.pathname}?id=${encodeURIComponent(app.myFullId)}&pin=${encodeURIComponent(app.myPin)}`;
                    document.getElementById('share-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(link)}`;
                    app.shareLink = link;
                }
                document.getElementById('share-overlay').classList.toggle('hidden', !show);
            },
            copyShareLink: () => {
                if (!app.shareLink) return;
                navigator.clipboard.writeText(app.shareLink).then(() => {
                    const btn = document.getElementById('btn-copy-share');
                    const original = btn.innerHTML;
                    btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i> COPIADO!';
                    setTimeout(() => { btn.innerHTML = original; }, 2000);
                }).catch(() => ui.log("Não foi possível copiar"));
            },
            toast: (msg) => {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.remove('opacity-0');
                clearTimeout(ui._toastTimer);
                ui._toastTimer = setTimeout(() => el.classList.add('opacity-0'), 3500);
            }
        };

        // === STORAGE ===
        const storage = {
            get: () => JSON.parse(localStorage.getItem('sc_cams_v30') || '[]'),
            add: (name, id, pin) => {
                const list = storage.get().filter(c => c.id !== id);
                list.push({name: name || `Term. ${id.slice(-3)}`, id, pin});
                localStorage.setItem('sc_cams_v30', JSON.stringify(list));
            },
            remove: (id) => {
                localStorage.setItem('sc_cams_v30', JSON.stringify(storage.get().filter(c => c.id !== id)));
                storage.renderList();
            },
            renderList: () => {
                const container = document.getElementById('saved-list');
                container.innerHTML = "";
                const cams = storage.get();
                if (cams.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = "text-center text-xs text-emerald-900 py-4 font-mono";
                    empty.textContent = "Nenhum terminal salvo ainda.";
                    container.appendChild(empty);
                    return;
                }
                cams.forEach(cam => {
                    const div = document.createElement('div');
                    div.className = "cam-item";

                    const info = document.createElement('div');
                    info.className = "flex-1";
                    info.style.cursor = "pointer";
                    info.addEventListener('click', () => app.load(cam.id, cam.pin));

                    const nameEl = document.createElement('div');
                    nameEl.className = "text-sm font-bold text-emerald-100";
                    nameEl.textContent = cam.name; // textContent: seguro contra HTML/aspas no apelido

                    const idEl = document.createElement('div');
                    idEl.className = "text-[10px] text-emerald-500 font-mono";
                    idEl.innerHTML = `<i class="fa-solid fa-fingerprint"></i> ID: `;
                    idEl.appendChild(document.createTextNode(cam.id));

                    info.appendChild(nameEl);
                    info.appendChild(idEl);

                    const delBtn = document.createElement('button');
                    delBtn.className = "text-emerald-900 hover:text-red-500 px-3 transition-colors";
                    delBtn.innerHTML = `<i class="fa-solid fa-trash"></i>`;
                    delBtn.addEventListener('click', () => storage.remove(cam.id));

                    div.appendChild(info);
                    div.appendChild(delBtn);
                    container.appendChild(div);
                });
            }
        };

        // === APP LOGIC ===
        const app = {
            peer: null, localStream: null, micStream: null, activeCall: null,
            monitors: [], currentFacing: 'environment', role: null, lastCreds: null, reconnectTimer: null, mediaConstraints: null,
            cameraLockedUntil: 0, pinFailCount: 0, pinFailWindowStart: 0, myFullId: null, myPin: null, shareLink: null,
            mediaRecorder: null, recordedChunks: [],

            broadcastViewerCount: () => {
                const n = app.monitors.length;
                const el = document.getElementById('viewer-count');
                if (el) el.innerText = n;
                app.monitors.forEach(m => { try { m.send({ viewerCount: n }); } catch(e) {} });
            },

            registerPinFailure: () => {
                const now = Date.now();
                if (!app.pinFailWindowStart || now - app.pinFailWindowStart > 120000) {
                    // Janela de 2 minutos: reinicia a contagem se passou muito tempo
                    app.pinFailWindowStart = now;
                    app.pinFailCount = 0;
                }
                app.pinFailCount = (app.pinFailCount || 0) + 1;
                if (app.pinFailCount >= 8) {
                    app.cameraLockedUntil = now + 5 * 60000; // 5 minutos de bloqueio total
                    app.pinFailCount = 0;
                    ui.log("Muitas tentativas de PIN erradas — bloqueado 5min");
                }
            },

            healLocalTrack: async (kind) => {
                if (!app.localStream || app.role !== 'camera') return;
                ui.log(kind === 'audio' ? "Microfone caiu, recuperando..." : "Câmera caiu, recuperando...");
                try {
                    const c = app.mediaConstraints || {};
                    const freshConstraints = kind === 'audio' ? { audio: c.audio || true } : { video: c.video || true };
                    const freshStream = await navigator.mediaDevices.getUserMedia(freshConstraints);
                    const newTrack = kind === 'audio' ? freshStream.getAudioTracks()[0] : freshStream.getVideoTracks()[0];
                    if (!newTrack) return;

                    const oldTrack = kind === 'audio' ? app.localStream.getAudioTracks()[0] : app.localStream.getVideoTracks()[0];
                    if (oldTrack) app.localStream.removeTrack(oldTrack);
                    app.localStream.addTrack(newTrack);
                    newTrack.onended = () => app.healLocalTrack(newTrack.kind);

                    if (kind === 'video') document.getElementById('vid-main').srcObject = app.localStream;

                    if (app.peer) {
                        Object.values(app.peer.connections).forEach(conns => conns.forEach(c => {
                            if (!c.peerConnection) return;
                            const sender = c.peerConnection.getSenders().find(s => s.track && s.track.kind === kind);
                            if (sender) sender.replaceTrack(newTrack).catch(()=>{});
                        }));
                    }
                } catch(e) {
                    ui.log("Falha ao recuperar " + (kind === 'audio' ? "microfone" : "câmera"));
                }
            },

            saveAndStart: (e) => {
                e.preventDefault();
                const name = document.getElementById('inp-name').value.trim();
                const id = document.getElementById('inp-id').value.trim().replace(/\s/g,'').toLowerCase();
                const pin = document.getElementById('inp-pin').value.trim();
                if(!id||!pin) return ui.log("Preencha ID e PIN");
                if (ui.mode === 'monitor') storage.add(name, id, pin);
                app.start(id, pin);
            },
            load: (id, pin) => {
                document.getElementById('inp-id').value = id;
                document.getElementById('inp-pin').value = pin;
                app.start(id, pin);
            },
            start: async (id, pin) => {
                try { document.getElementById('keep-alive').play(); } catch(e){}
                await requestWakeLock(); // Inicia o WakeLock
                document.getElementById('ui-setup').classList.add('hidden');
                document.getElementById('ui-app').classList.remove('hidden');
                if(ui.mode === 'camera') {
                    const fullId = id + '-' + getOrCreateSalt(id);
                    app.myFullId = fullId;
                    app.myPin = pin;
                    app.startCamera(PREFIX + fullId, pin);
                } else {
                    app.startMonitor(PREFIX + id, pin);
                }
            },
            stop: () => {
                if (app.mediaRecorder && app.mediaRecorder.state === 'recording') app.mediaRecorder.stop();
                if(app.localStream) { app.localStream.getTracks().forEach(t=>t.stop()); app.localStream=null; }
                if(app.micStream) { app.micStream.getTracks().forEach(t=>t.stop()); app.micStream=null; }
                if(app.activeCall) { app.activeCall.close(); }
                if(app.peer) { app.peer.destroy(); app.peer=null; }
                
                app.monitors = []; app.activeCall = null;
                app.role = null; app.lastCreds = null;
                clearTimeout(app.reconnectTimer);
                const v = document.getElementById('vid-main');
                v.srcObject = null;
                
                document.getElementById('ui-app').classList.add('hidden');
                document.getElementById('ui-setup').classList.remove('hidden');
                document.getElementById('loader').classList.remove('hidden');
                document.getElementById('stealth-layer').style.display = 'none';
                ['btn-talk','btn-swap','btn-sound','btn-fit','btn-share','btn-record','badge-viewers','badge-status','btn-stealth', 'reconnect-overlay'].forEach(i=>document.getElementById(i).classList.add('hidden'));
                
                if(ui.mode === 'monitor') storage.renderList();
            },

            // CAMERA
            startCamera: async (myId, pin) => {
                app.role = 'camera';
                app.lastCreds = { myId, pin };
                document.getElementById('badge-viewers').classList.remove('hidden');
                document.getElementById('btn-stealth').classList.remove('hidden');
                document.getElementById('btn-fit').classList.remove('hidden');
                document.getElementById('btn-share').classList.remove('hidden');
                document.getElementById('loader-txt').innerText = "INICIALIZANDO LENTES...";

                try {
                    let constraints = isMobile 
                        ? { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 }, video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } } }
                        : { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 }, video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } } };

                    try {
                        app.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                        if(isMobile) app.currentFacing = 'environment';
                    } catch(err1) {
                        app.localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                        if(isMobile) app.currentFacing = 'user';
                    }
                    app.mediaConstraints = constraints;
                    
                    const v = document.getElementById('vid-main');
                    v.srcObject = app.localStream;
                    v.muted = true; 
                    if(isMobile) document.getElementById('btn-swap').classList.remove('hidden');

                    app.localStream.getTracks().forEach(track => {
                        track.onended = () => app.healLocalTrack(track.kind);
                    });

                } catch(e) { 
                    ui.toast("Sem acesso à câmera"); 
                    app.stop(); return; 
                }

                document.getElementById('loader-txt').innerText = "CONECTANDO AO SERVIDOR...";
                app.peer = new Peer(myId, { debug: 1, config: ICE_SERVERS });
                
                app.peer.on('open', () => { 
                    document.getElementById('loader').classList.add('hidden'); 
                    document.getElementById('badge-status').classList.remove('hidden');
                });
                
                app.peer.on('error', e => {
                    if(e.type==='unavailable-id') { ui.toast("Esse ID já está em uso, escolha outro"); app.stop(); }
                    else ui.log("Erro: " + e.type);
                });

                app.peer.on('disconnected', () => {
                    // Sinalização caiu (ex: rede instável) mas o peer ainda está vivo:
                    // reconnect() recupera a MESMA identidade (ID), sem isso os espectadores
                    // que já salvaram essa câmera deixariam de conseguir conectar.
                    ui.log("Sinal perdido, reconectando...");
                    setTimeout(() => {
                        if (app.peer && !app.peer.destroyed) {
                            try { app.peer.reconnect(); } catch(e) {}
                        }
                    }, 1500);
                });

                app.peer.on('close', () => {
                    // Peer morreu de vez (raro): só recriar do zero resolve, com o mesmo ID/PIN
                    if (app.role === 'camera' && app.lastCreds) {
                        ui.log("Conexão encerrada, reiniciando...");
                        setTimeout(() => app.startCamera(app.lastCreds.myId, app.lastCreds.pin), 1500);
                    }
                });

                app.peer.on('connection', conn => {
                    // Lockout global: se alguém já esgotou tentativas reconectando várias vezes,
                    // bloqueia novas tentativas por um tempo, independente da conexão usada.
                    if (Date.now() < (app.cameraLockedUntil || 0)) {
                        conn.close();
                        return;
                    }

                    let pinAttempts = 0;
                    let authorized = false;
                    conn.on('data', data => {
                        if (authorized) {
                            // Pós-autenticação: só tratamos respostas de heartbeat (pong) por aqui
                            if (data && data.pong) conn._lastPong = Date.now();
                            return;
                        }
                        if (pinAttempts >= 3 || Date.now() < (app.cameraLockedUntil || 0)) {
                            conn.close();
                            return;
                        }
                        if (data.auth !== pin) {
                            pinAttempts++;
                            app.registerPinFailure();
                            if (pinAttempts >= 3) conn.close();
                            return;
                        }
                        authorized = true;
                        {
                            app.monitors = app.monitors.filter(m => m.peer !== conn.peer);
                            app.monitors.push(conn);
                            app.broadcastViewerCount();

                            const call = app.peer.call(conn.peer, app.localStream);
                            
                            // Otimização de bitrate
                            const sender = call.peerConnection.getSenders().find(s=>s.track.kind==='video');
                            if(sender) {
                                const p = sender.getParameters();
                                if(!p.encodings) p.encodings=[{}];
                                p.encodings[0].maxBitrate = 400000; // Leve redução para garantir fluidez no 4G
                                sender.setParameters(p).catch(()=>{});
                            }
                            
                            conn.on('close', () => { 
                                app.monitors = app.monitors.filter(c=>c.peer!==conn.peer); 
                                app.broadcastViewerCount();
                                clearInterval(heartbeatInterval);
                            });

                            // Heartbeat: pega conexões "zumbis" que ficam com ICE 'connected' mas
                            // não trocam mais dados de verdade (acontece em relays TURN instáveis).
                            conn._lastPong = Date.now();
                            const heartbeatInterval = setInterval(() => {
                                if (Date.now() - conn._lastPong > 35000) {
                                    clearInterval(heartbeatInterval);
                                    conn.close();
                                    return;
                                }
                                try { conn.send({ ping: Date.now() }); } catch(e) {}
                            }, 15000);

                            let iceGraceTimer = null;
                            conn.peerConnection.oniceconnectionstatechange = () => {
                                const state = conn.peerConnection.iceConnectionState;
                                if(state === 'disconnected') {
                                    // Espera um pouco antes de remover: quedas curtas de rede costumam
                                    // se recuperar sozinhas, remover na hora causava contagem "bugada".
                                    clearTimeout(iceGraceTimer);
                                    iceGraceTimer = setTimeout(() => {
                                        if(conn.peerConnection.iceConnectionState === 'disconnected' || conn.peerConnection.iceConnectionState === 'failed') {
                                            app.monitors = app.monitors.filter(m => m.peer !== conn.peer);
                                            app.broadcastViewerCount();
                                        }
                                    }, 8000);
                                } else if(state === 'connected' || state === 'completed') {
                                    clearTimeout(iceGraceTimer);
                                }
                            }
                        }
                    });
                });
                
                app.peer.on('call', call => { 
                    call.answer(); 
                    call.on('stream', st => { 
                        const a=document.getElementById('audio-intercom'); 
                        a.srcObject=st; 
                        a.play().catch(()=>{}); 
                    }); 
                });
            },

            // MONITOR
            startMonitor: (targetId, pin) => {
                app.role = 'monitor';
                app.lastCreds = { targetId, pin };
                // Garante que não sobra peer antigo vivo (conexões fantasmas) antes de recriar
                if (app.peer && !app.peer.destroyed) {
                    try { app.peer.removeAllListeners(); app.peer.destroy(); } catch(e) {}
                }
                app.activeCall = null;

                document.getElementById('loader').classList.remove('hidden');
                document.getElementById('btn-talk').classList.remove('hidden');
                document.getElementById('btn-fit').classList.remove('hidden');
                document.getElementById('btn-record').classList.remove('hidden');
                document.getElementById('badge-status').classList.remove('hidden');
                document.getElementById('loader-txt').innerText = "BUSCANDO SINAL...";
                
                app.peer = new Peer(null, { debug: 1, config: ICE_SERVERS });
                app.peer.on('open', () => {
                    app.connect(targetId, pin);
                    // Handler de 'call' registrado uma única vez por peer, não a cada reconexão
                    app.peer.on('call', call => {
                        app.activeCall = call; call.answer();
                        call.on('stream', stream => {
                            document.getElementById('loader').classList.add('hidden');
                            ui.showReconnect(false);
                            const v = document.getElementById('vid-main');
                            v.srcObject = stream; v.muted = false;
                            v.setAttribute('playsinline', '');
                            v.play().catch(() => { v.muted = true; v.play(); document.getElementById('btn-sound').classList.remove('hidden'); });

                            // WATCHDOG NATIVO (Otimizado para bateria)
                            if (v._watchdogHandler) v.removeEventListener('timeupdate', v._watchdogHandler);
                            v._watchdogHandler = () => {
                                if(v.paused || ui.mode !== 'monitor') return;
                                if(v.buffered.length > 0) {
                                    const diff = v.buffered.end(0) - v.currentTime;
                                    // Só corrige se o atraso for maior que 1 segundo, poupando CPU
                                    if(diff > 1.0) v.currentTime = v.buffered.end(0);
                                }
                            };
                            v.addEventListener('timeupdate', v._watchdogHandler);
                        });
                        call.on('close', () => {
                            ui.showReconnect(true);
                            if (app.mediaRecorder && app.mediaRecorder.state === 'recording') app.mediaRecorder.stop();
                        });
                    });
                });
                app.peer.on('disconnected', () => {
                    ui.showReconnect(true);
                    setTimeout(() => {
                        if (app.peer && !app.peer.destroyed) {
                            try { app.peer.reconnect(); } catch(e) {}
                        }
                    }, 1500);
                });

                app.peer.on('error', e => {
                    ui.log("Erro: " + e.type);
                    clearTimeout(app.reconnectTimer);
                    app.reconnectTimer = setTimeout(()=>app.startMonitor(targetId, pin), 3000);
                });
            },

            connect: (targetId, pin) => {
                const conn = app.peer.connect(targetId);
                conn.on('open', () => { ui.showReconnect(false); conn.send({auth: pin}); });
                conn.on('data', data => {
                    if (data && typeof data.viewerCount === 'number') {
                        document.getElementById('viewer-count').innerText = data.viewerCount;
                        document.getElementById('badge-viewers').classList.remove('hidden');
                    }
                    if (data && data.ping) {
                        try { conn.send({ pong: true }); } catch(e) {}
                    }
                });
                conn.on('close', () => {
                    ui.showReconnect(true);
                    clearTimeout(app.reconnectTimer);
                    app.reconnectTimer = setTimeout(()=>app.connect(targetId, pin), 3000);
                });
            },

            startTalk: async () => {
                if (!app.activeCall || ui.mode !== 'monitor') return;
                document.getElementById('btn-talk').classList.add('talking');
                try { app.micStream = await navigator.mediaDevices.getUserMedia({audio:true}); app.peer.call(app.activeCall.peer, app.micStream); } catch(e){ ui.toast("Microfone bloqueado"); }
            },
            stopTalk: () => {
                document.getElementById('btn-talk').classList.remove('talking');
                if(app.micStream) { app.micStream.getTracks().forEach(t=>t.stop()); app.micStream=null; }
            },

            // GRAVAÇÃO LOCAL (só no espectador; nada sai do aparelho, sem servidor/banco)
            toggleRecording: () => {
                if (app.mediaRecorder && app.mediaRecorder.state === 'recording') {
                    app.mediaRecorder.stop();
                    return;
                }
                const v = document.getElementById('vid-main');
                if (!v.srcObject) { ui.toast("Sem sinal pra gravar ainda"); return; }

                const mimeCandidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
                const mimeType = mimeCandidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
                if (!mimeType) { ui.toast("Gravação não suportada neste navegador"); return; }

                app.recordedChunks = [];
                try {
                    app.mediaRecorder = new MediaRecorder(v.srcObject, { mimeType });
                } catch(e) {
                    ui.toast("Não foi possível iniciar a gravação");
                    return;
                }
                app.mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) app.recordedChunks.push(ev.data); };
                app.mediaRecorder.onstop = () => {
                    document.getElementById('icon-record').classList.remove('text-red-500','animate-pulse');
                    if (app.recordedChunks.length === 0) return;
                    const blob = new Blob(app.recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const ts = new Date().toISOString().replace(/[:.]/g, '-');
                    const a = document.createElement('a');
                    a.href = url; a.download = `securitycam_${ts}.webm`;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 10000);
                    ui.toast("Gravação salva no dispositivo");
                    app.recordedChunks = [];
                };
                app.mediaRecorder.start(1000); // chunks a cada 1s: evita perder tudo se travar no meio
                document.getElementById('icon-record').classList.add('text-red-500','animate-pulse');
                ui.toast("Gravando localmente...");
            },

            swapCam: async () => {
                if(!app.localStream) return;
                app.currentFacing = (app.currentFacing === 'environment') ? 'user' : 'environment';
                app.localStream.getTracks().forEach(t => t.stop());
                try {
                    app.localStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false, channelCount: 1 },
                        video: { facingMode: app.currentFacing, width: 640, height: 480, frameRate: 15 }
                    });
                } catch(e) {
                    app.localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                }
                document.getElementById('vid-main').srcObject = app.localStream;
                const newVideoTrack = app.localStream.getVideoTracks()[0];
                const newAudioTrack = app.localStream.getAudioTracks()[0];
                Object.values(app.peer.connections).forEach(conns => conns.forEach(c => {
                    if (!c.peerConnection) return;
                    c.peerConnection.getSenders().forEach(s => {
                        if (!s.track) return;
                        if (s.track.kind === 'video' && newVideoTrack) s.replaceTrack(newVideoTrack);
                        else if (s.track.kind === 'audio' && newAudioTrack) s.replaceTrack(newAudioTrack);
                    });
                }));
            }
        };

        // Se aberto via link/QR compartilhado (?id=...&pin=...), pré-preenche o modo espectador
        (() => {
            const params = new URLSearchParams(location.search);
            const sharedId = params.get('id'), sharedPin = params.get('pin');
            if (sharedId) {
                ui.setMode('monitor');
                document.getElementById('inp-id').value = sharedId;
                if (sharedPin) document.getElementById('inp-pin').value = sharedPin;
            }
        })();
    </script>
</body>
</html>
